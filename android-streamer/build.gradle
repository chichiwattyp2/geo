// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

// Note: Project repositories are defined in settings.gradle (modern Gradle approach)
// buildscript repositories above are separate and required for build plugins

task clean(type: Delete) {
    delete rootProject.buildDir
}
